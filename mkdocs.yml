site_name: Go Opik SDK
site_description: Go SDK for Opik - Open-source LLM observability platform by Comet ML
site_url: https://plexusone.github.io/opik-go/
repo_url: https://github.com/plexusone/opik-go
repo_name: plexusone/opik-go

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css
  - stylesheets/plexusone.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Testing: getting-started/testing.md
    - Development: getting-started/development.md
  - Core Concepts:
    - Traces and Spans: core-concepts/traces-and-spans.md
    - Context Propagation: core-concepts/context-propagation.md
    - Feedback Scores: core-concepts/feedback-scores.md
  - Features:
    - Datasets: features/datasets.md
    - Experiments: features/experiments.md
    - Prompts: features/prompts.md
    - Streaming: features/streaming.md
    - Batching: features/batching.md
  - Evaluation:
    - Overview: evaluation/overview.md
    - Heuristic Metrics: evaluation/heuristic-metrics.md
    - LLM Judges: evaluation/llm-judges.md
  - Integrations:
    - OpenAI: integrations/openai.md
    - Anthropic: integrations/anthropic.md
    - omnillm: integrations/omnillm.md
    - HTTP Middleware: integrations/http-middleware.md
  - Tutorials:
    - Agentic Observability: tutorials/agentic-observability.md
  - Releases:
    - v0.6.0: releases/v0.6.0.md
    - v0.5.0: releases/v0.5.0.md
    - v0.4.0: releases/v0.4.0.md
  - CLI Reference: cli.md
  - API Reference: api-reference.md
  - AX Package:
    - Overview: ax/overview.md
    - Error Codes: ax/errors.md
    - Retry Policies: ax/retry.md
    - Capabilities: ax/capabilities.md
  - Case Studies:
    - AX Integration: case-studies/ax-integration.md
  - Presentation: presentation.html
